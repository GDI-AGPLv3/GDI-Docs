name: Lock de dependencias

# Falla si requirements.lock no corresponde a requirements.txt (GDI-773A).
# uv respeta las versiones que ya estan en el lock: solo cambia algo si cambio requirements.txt.
on:
  push:
    paths:
      - requirements.txt
      - requirements.lock
      - .github/workflows/lock-check.yml
  pull_request:
    paths:
      - requirements.txt
      - requirements.lock
      - .github/workflows/lock-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: requirements.lock al dia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        run: pip install "uv==0.8.0"

      - name: Regenerar el lock y comparar
        run: |
          CMD="uv pip compile requirements.txt --generate-hashes --universal --python-version 3.12 -o requirements.lock"
          uv pip compile requirements.txt --generate-hashes --universal --python-version 3.12 --quiet \
            --custom-compile-command "$CMD" -o requirements.lock
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock no corresponde a requirements.txt. Corre: $CMD y commitealo."
            exit 1
          fi
